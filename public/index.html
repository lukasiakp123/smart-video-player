<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Video Player</title>
  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
    }
    #video-section {
      max-width: 800px;
      margin: 50px auto;
      text-align: center;
    }
    video {
      width: 100%;
      max-width: 800px;
      height: auto;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      font-size: 16px;
    }
    .spacer {
      height: 1400px;
      background: #eee;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #f44336;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 9999;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Smart Video Player Demo</h1>

  <div id="video-section">
    <video id="video" controls width="640" height="360" ></video>
    <div>
      <button id="snapshot">Take Snapshot</button>
    </div>
  </div>

  <div class="spacer">Scroll up to see the video again</div>

  <script type="module" src="./player.js"></script>
</body>
</html>
